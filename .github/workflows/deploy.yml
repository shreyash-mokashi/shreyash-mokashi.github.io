# Builds the static site and publishes it to the gh-pages branch.
#
# Pages settings this expects:
#   Settings -> Pages -> Source = "Deploy from a branch"
#   Branch = gh-pages, folder = / (root)
#
# Why gh-pages rather than the GitHub Actions Pages deployment: with a
# branch-based Pages source, GitHub runs its own Jekyll build on every push to
# that branch. When this workflow also published through actions/deploy-pages,
# both wrote to the same site and whichever finished last won — so the live
# site flipped between the real build and a Jekyll rendering of README.md,
# while both workflows reported success.
#
# Publishing to gh-pages removes the race. Jekyll still runs, but it finds a
# finished site with a .nojekyll marker at the root and copies it verbatim.
# There is one publisher and nothing left to race.
#
# gh-pages is generated. Never commit to it by hand; it is force-pushed on
# every deploy.
#
# BASE_PATH is empty because this is a <username>.github.io repo, served from
# the domain root. For any other repo name it must be /<repo-name>.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - name: No inline UI text in components
        run: pnpm check:text

      - name: Every styles.* reference resolves
        run: pnpm check:css

      - name: Build static export
        env:
          BASE_PATH: ''
        run: pnpm build

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Without this GitHub Pages drops the _next/ directory, because it
          # treats directories starting with an underscore as private, and the
          # site renders with no CSS or JavaScript.
          touch out/.nojekyll

          # Fail loudly rather than publishing an empty site.
          test -f out/index.html

          cd out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Built site from ${GITHUB_SHA:0:7}"
          git push --force -q \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
